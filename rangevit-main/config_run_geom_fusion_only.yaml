checkpoint: null
pretrained_model: timmImageNet21k
reuse_pos_emb: true
reuse_patch_emb: false
augmentation:
  p_flipx: 0.0
  p_flipy: 0.5
  p_transx: 0.5
  trans_xmin: -5
  trans_xmax: 5
  p_transy: 0.5
  trans_ymin: -3
  trans_ymax: 3
  p_transz: 0.5
  trans_zmin: -1
  trans_zmax: 0.0
  p_rot_roll: 0.5
  rot_rollmin: -5
  rot_rollmax: 5
  p_rot_pitch: 0.5
  rot_pitchmin: -5
  rot_pitchmax: 5
  p_rot_yaw: 0.5
  rot_yawmin: 5
  rot_yawmax: -5
sensor:
  name: HDL64
  type: spherical
  scan_proj: true
  proj_h: 64
  proj_w: 2048
  fov_up: 3.0
  fov_down: -25.0
  fov_left: -180
  fov_right: 180
  img_mean:
  - 12.12
  - 10.88
  - 0.23
  - -1.04
  - 0.21
  img_stds:
  - 12.32
  - 11.47
  - 6.91
  - 0.86
  - 0.16
