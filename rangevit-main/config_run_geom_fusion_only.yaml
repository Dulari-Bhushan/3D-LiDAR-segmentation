num_workers: 4
id: run_geom_fusion_only
dataset: SemanticKitti
n_classes: 20
use_trainval: false
use_in_domain_split: true
in_domain_split_ratio: 0.8
has_label: true
val_frequency: 1
n_epochs: 60
warmup_epochs: 20
batch_size: 4
batch_size_val: 1
lr: 0.0001
train_result_frequency: 100
vit_backbone: vit_small_patch16_384
in_channels: 5
patch_size:
- 2
- 8
patch_stride:
- 2
- 8
image_size:
- 64
- 384
window_size:
- 64
- 384
window_stride:
- 64
- 256
original_image_size:
- 64
- 2048
conv_stem: ConvStem
stem_base_channels: 32
D_h: 128
decoder: up_conv
skip_filters: 128
use_kpconv: false
use_geometry_fusion: true
geometry_fusion_channels: 32
use_interpretable_objective: false
prototype_use_geometry: true
prototype_geo_scale: 1.0
prototype_momentum: 0.9
prototype_margin: 0.5
prototype_min_pixels: 128
lambda_prototype: 0.0
lambda_geometry: 0.0
lambda_attention_reg: 0.0
attention_entropy_target: 0.45
